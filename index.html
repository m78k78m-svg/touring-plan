<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ツーリング計画＆ログ共有ポータル | MotoPlanner</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- アイコン (FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-20">

  <!-- ヘッダー -->
  <header class="bg-slate-800/90 backdrop-blur sticky top-0 z-50 border-b border-slate-700 shadow-md">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-motorcycle"></i>
        </div>
        <div>
          <h1 class="text-lg font-extrabold text-white tracking-wide">MotoPlanner</h1>
          <p class="text-xs text-slate-400">ツーリング計画＆ログ共有ポータル</p>
        </div>
      </div>
      <button onclick="openNewPlanModal()" class="inline-flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl transition text-xs sm:text-sm shadow-md shadow-amber-500/20">
        <i class="fa-solid fa-plus"></i>
        <span>計画を追加</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

    <!-- ウェルカムバナー -->
    <section class="relative overflow-hidden bg-gradient-to-r from-slate-800 via-slate-850 to-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-2xl">
      <div class="relative z-10 max-w-2xl space-y-3">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-amber-400/10 text-amber-300 border border-amber-400/20">
          <i class="fa-solid fa-compass"></i>
          <span>ツーリング・ポータル</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
          仲間とつくる、次のツーリング。
        </h2>
        <p class="text-sm text-slate-300 leading-relaxed">
          計画はここで共有、思い出もここに残す。
        </p>
      </div>
    </section>

    <!-- タブ切り替えボタン -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-2">
      <div class="flex items-center gap-2">
        <button id="tab-upcoming" onclick="switchTab('upcoming')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition bg-amber-500 text-slate-950 shadow-md">
          <i class="fa-solid fa-calendar-check"></i>
          <span id="tab-upcoming-label">計画中ツーリング</span>
        </button>
        <button id="tab-past" onclick="switchTab('past')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-slate-200 hover:bg-slate-800">
          <i class="fa-solid fa-flag-checkered"></i>
          <span id="tab-past-label">過去のレポート</span>
        </button>
      </div>
    </div>

    <!-- 1. 計画中ツーリング一覧セクション -->
    <section id="section-upcoming" class="space-y-4">
      <div id="upcoming-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- JSでカードを描画 -->
      </div>
    </section>

    <!-- 2. 過去のレポート一覧セクション（初期非表示） -->
    <section id="section-past" class="space-y-4 hidden">
      <div id="past-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- JSでカードを描画 -->
      </div>
    </section>

  </main>

  <!-- 新規ツーリング計画作成モーダル -->
  <div id="new-plan-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-route text-amber-400"></i>
          <span>新しいツーリング計画を追加</span>
        </h3>
        <button onclick="closeNewPlanModal()" class="text-slate-400 hover:text-white text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="new-plan-form" onsubmit="handleCreatePlan(event)" class="space-y-3.5 text-xs sm:text-sm">
        <div>
          <label class="block text-slate-300 font-bold mb-1">ツーリング名・タイトル *</label>
          <input type="text" id="form-title" required placeholder="例: ビーナスライン絶景高原ツーリング" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-400">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-bold mb-1">開催日程 *</label>
            <input type="text" id="form-date" required placeholder="例: 2026.11.20 (日)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">エリア・目的地 *</label>
            <input type="text" id="form-area" required placeholder="例: 長野・霧ヶ峰エリア" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-bold mb-1">集合場所・時間</label>
            <input type="text" id="form-meeting" placeholder="例: 談合坂SA (07:00)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">走行予定距離</label>
            <input type="text" id="form-distance" placeholder="例: 約260 km" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">状態の選択 *</label>
          <div class="flex gap-4 p-2 bg-slate-900 border border-slate-700 rounded-xl">
            <label class="flex items-center gap-2 cursor-pointer text-slate-200">
              <input type="radio" name="form-status" value="upcoming" checked class="text-amber-500 focus:ring-amber-400">
              <span>計画中（開催予定）</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-200">
              <input type="radio" name="form-status" value="past" class="text-amber-500 focus:ring-amber-400">
              <span>過去のレポート（走行完了）</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">概要・見どころ</label>
          <textarea id="form-desc" rows="3" placeholder="例: 初冬前のビーナスラインを駆け抜け、名物の信州そばと温泉を堪能します！" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-amber-400"></textarea>
        </div>

        <div class="pt-3 flex justify-end gap-2 border-t border-slate-700">
          <button type="button" onclick="closeNewPlanModal()" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold transition text-xs">
            キャンセル
          </button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold transition text-xs shadow-md shadow-amber-500/20">
            作成して保存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 削除確認モーダル（誤タップ完全防止） -->
  <div id="delete-confirm-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 mx-auto flex items-center justify-center text-xl border border-rose-500/30">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-white">ツーリング計画の削除</h3>
        <p class="text-xs text-slate-300 mt-1.5 leading-relaxed">
          <strong id="delete-target-title" class="text-amber-400 block mb-1"></strong>
          この計画を完全に削除してもよろしいですか？<br>この操作は取り消せません。
        </p>
      </div>
      <div class="flex gap-2.5 pt-2">
        <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold transition">
          キャンセル
        </button>
        <button id="delete-confirm-btn" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition shadow-md shadow-rose-600/30">
          削除する
        </button>
      </div>
    </div>
  </div>

  <!-- フッター -->
  <footer class="max-w-5xl mx-auto px-4 mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
    <p>ツーリング計画＆ログ共有ポータル • MotoPlanner</p>
  </footer>

  <!-- スクリプト：計画の追加・削除・永続化＆UI強化 -->
  <script>
    const STORAGE_KEY = 'motoplanner_tourings_v2';

    // デフォルトの初期ツーリングデータ
    const DEFAULT_TOURING_LIST = [
      {
        id: 'plan_kyushu_2026',
        isUpcoming: true,
        title: '湯けむりと潮騒の記憶：嬉野温泉と玄界灘を巡る秋の道',
        date: '2026.11.13(金) 12:00 〜 11.14(土) 16:00着',
        isoDate: '2026-11-13',
        area: '福岡・佐賀（三瀬峠・嬉野温泉・波戸岬）',
        badge: '1泊2日・開催予定',
        alert: '16:00着目標(18:00返却)',
        desc: '1日目は全線下道で三瀬峠〜嘉瀬川ダム〜大正屋へ。2日目は波戸岬シーサイドルートを快走し16:00目標で博多板付へ帰着！',
        distance: '約258 km',
        hotel: '嬉野温泉 大正屋',
        spot: '三瀬峠 ➔ 嬉野 ➔ 波戸岬',
        meeting: '博多区板付 (12:00)',
        link: 'touring-kyushu.html',
        members: [
          { name: 'Masaki', bike: 'Speed Twin 900', img: 'images/bike-speed-twin-900.jpg' },
          { name: 'Daiki', bike: 'Ninja ZX-4RR', img: 'images/bike-zx4rr.jpg' },
          { name: 'Kunihiko', bike: 'Z900RS', img: 'images/bike-z900rs.jpg' }
        ]
      },
      {
        id: 'plan_hakone_2026',
        isUpcoming: true,
        title: '箱根・芦ノ湖絶景ワインディング ツーリング',
        date: '2026.11.23 (祝)',
        isoDate: '2026-11-23',
        area: '神奈川 • 箱根・芦ノ湖エリア',
        badge: '日帰り計画中',
        alert: '',
        desc: '西湘バイパスからアネスト岩田ターンパイクを一気に駆け上がり、大観山展望台から富士山と芦ノ湖のパノラマを望む王道ツーリング！',
        distance: '約45 km',
        hotel: '日帰り',
        spot: 'ターンパイク ➔ 大観山',
        meeting: '西湘PA (07:30)',
        link: 'touring-sample.html',
        members: []
      },
      {
        id: 'plan_izu_past',
        isUpcoming: false,
        title: '伊豆西海岸 サンセット快走ツーリング',
        date: '2026.10.12 開催',
        isoDate: '2026-10-12',
        area: '静岡 • 伊豆半島一周',
        badge: '走行完了',
        alert: '',
        desc: '天候に恵まれ、西伊豆スカイラインからの富士山と夕日が最高でした！無事故・無違反で完走。',
        distance: '約240 km',
        hotel: '西伊豆温泉',
        spot: '修善寺 ➔ 堂ヶ島',
        meeting: 'ターンパイク',
        link: '#',
        members: []
      }
    ];

    function getTourings() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return DEFAULT_TOURING_LIST;
    }

    function saveTourings(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderCards();
    }

    // カウントダウン日数の計算
    function getDaysDiff(item) {
      const dateStr = item.isoDate || item.date;
      if (!dateStr) return null;
      const match = dateStr.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
      if (!match) return null;
      const target = new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function renderCards() {
      const list = getTourings();
      const upContainer = document.getElementById('upcoming-container');
      const pastContainer = document.getElementById('past-container');

      // 計画中と過去レポートを分割
      let upList = list.filter(item => item.isUpcoming);
      let pastList = list.filter(item => !item.isUpcoming);

      // 開催日の近い順にソート（昇順）
      upList.sort((a, b) => {
        const dateA = a.isoDate || a.date || '';
        const dateB = b.isoDate || b.date || '';
        return dateA.localeCompare(dateB);
      });

      document.getElementById('tab-upcoming-label').textContent = `計画中ツーリング (${upList.length})`;
      document.getElementById('tab-past-label').textContent = `過去のレポート (${pastList.length})`;

      // 計画中レンダリング
      upContainer.innerHTML = '';
      if (upList.length === 0) {
        upContainer.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 bg-slate-800/40 rounded-2xl border border-slate-700/60">現在計画中のツーリングはありません。「計画を追加」ボタンから作成できます。</div>';
      } else {
        upList.forEach(item => {
          upContainer.appendChild(createCardElement(item));
        });
      }

      // 過去レポレンダリング
      pastContainer.innerHTML = '';
      if (pastList.length === 0) {
        pastContainer.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 bg-slate-800/40 rounded-2xl border border-slate-700/60">過去のツーリングレポートはありません。</div>';
      } else {
        pastList.forEach(item => {
          pastContainer.appendChild(createCardElement(item));
        });
      }
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'group bg-slate-800 rounded-3xl border border-slate-700 hover:border-amber-500/50 transition-all duration-300 overflow-hidden shadow-xl hover:-translate-y-1 block relative flex flex-col justify-between';

      const diff = getDaysDiff(item);
      let countdownHtml = '';
      if (item.isUpcoming && diff !== null) {
        if (diff > 0) {
          countdownHtml = `
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-black bg-amber-500/20 text-amber-300 border border-amber-500/30 backdrop-blur">
              <i class="fa-solid fa-hourglass-half text-[10px]"></i>
              <span>あと ${diff} 日</span>
            </span>
          `;
        } else if (diff === 0 || diff === -1) {
          countdownHtml = `
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-black bg-emerald-500/25 text-emerald-300 border border-emerald-500/40 backdrop-blur animate-pulse">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>開催中！</span>
            </span>
          `;
        } else {
          countdownHtml = `
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-black bg-rose-500/25 text-rose-300 border border-rose-500/40 backdrop-blur">
              <i class="fa-solid fa-flag-checkered text-[10px]"></i>
              <span>完走待ち</span>
            </span>
          `;
        }
      }

      const alertBadge = item.alert ? `
        <span class="text-xs font-bold text-rose-300 bg-rose-950/80 px-2 py-0.5 rounded-lg backdrop-blur border border-rose-500/40">
          <i class="fa-solid fa-clock mr-1"></i>${item.alert}
        </span>
      ` : '';

      // 参加ライダー（バイク写真アバター）HTML
      let membersHtml = '';
      if (item.members && item.members.length > 0) {
        membersHtml = `
          <div class="pt-3 border-t border-slate-700/60 flex flex-wrap items-center justify-between gap-2">
            <span class="text-[11px] font-bold text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-user-group text-amber-400"></i>
              <span>参加メンバー (${item.members.length}名)</span>
            </span>
            <div class="flex flex-wrap items-center gap-2">
              ${item.members.map(m => `
                <div class="flex items-center gap-1.5 bg-slate-900/90 pl-1 pr-2.5 py-1 rounded-full border border-slate-700 shadow-sm" title="${m.name} (${m.bike})">
                  <img src="${m.img}" alt="${m.name}のバイク" class="w-6 h-6 rounded-full object-cover border border-amber-400/80 shadow">
                  <span class="text-[11px] font-bold text-slate-200">${m.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <!-- カードヘッダー部 -->
        <div class="h-28 bg-gradient-to-tr from-amber-600/30 via-slate-800 to-sky-700/30 p-4 flex flex-col justify-between border-b border-slate-700/60 relative">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 backdrop-blur">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                ${item.badge || (item.isUpcoming ? '計画中' : '走行完了')}
              </span>
              ${alertBadge}
            </div>
            
            <!-- 右上操作エリア（カウントダウン ＋ 安全メニュー） -->
            <div class="flex items-center gap-2">
              ${countdownHtml}
              <div class="relative">
                <button onclick="event.stopPropagation(); toggleCardMenu('${item.id}')" class="w-7 h-7 rounded-lg bg-black/40 hover:bg-black/60 text-slate-300 hover:text-white flex items-center justify-center text-xs transition border border-white/10" title="メニュー">
                  <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
                <div id="card-menu-${item.id}" class="hidden absolute right-0 top-8 z-30 w-36 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 text-xs">
                  <button onclick="openDeleteModal('${item.id}', '${item.title}')" class="w-full text-left px-3 py-2 text-rose-400 hover:bg-rose-500/10 flex items-center gap-2 font-medium">
                    <i class="fa-regular fa-trash-can"></i>
                    <span>計画を削除</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
          
          <div class="text-xs text-amber-300 font-semibold flex items-center gap-1">
            <i class="fa-solid fa-location-dot"></i>
            <span>${item.area}</span>
          </div>
        </div>

        <!-- カードメイン部 -->
        <div class="p-5 space-y-4 flex-1 flex flex-col justify-between">
          <div class="space-y-2">
            <div class="text-xs text-slate-400 font-medium">
              <i class="fa-regular fa-calendar mr-1 text-amber-400"></i>${item.date}
            </div>
            <h3 class="text-lg font-black text-white group-hover:text-amber-400 transition leading-snug">
              ${item.title}
            </h3>
            <p class="text-xs sm:text-sm text-slate-300 line-clamp-2 leading-relaxed">
              ${item.desc || '見どころ満載のツーリング計画です！'}
            </p>
          </div>

          <div class="space-y-3">
            <!-- 参加メンバー（アバター） -->
            ${membersHtml}

            <!-- 改善後の目的地タイル（距離・宿泊先・主要ルート） -->
            <div class="grid grid-cols-3 gap-2 border-t border-slate-700/60 pt-3 text-center text-xs">
              <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                <span class="text-slate-400 block text-[10px] mb-0.5">総走行距離</span>
                <span class="font-black text-white text-xs">${item.distance || '未定'}</span>
              </div>
              <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                <span class="text-slate-400 block text-[10px] mb-0.5">宿泊先</span>
                <span class="font-black text-rose-300 text-xs truncate block" title="${item.hotel || item.spot || '日帰り'}">${item.hotel || '日帰り'}</span>
              </div>
              <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                <span class="text-slate-400 block text-[10px] mb-0.5">主要ルート</span>
                <span class="font-black text-amber-400 text-[11px] truncate block" title="${item.spot || '未定'}">${item.spot || '未定'}</span>
              </div>
            </div>

            <!-- アクションボタン（誤タップ防止：完走ボタンと詳細ボタンを安全に配置） -->
            <div class="flex items-center justify-between pt-2">
              <button onclick="togglePlanStatus('${item.id}')" class="text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 ${item.isUpcoming ? 'bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 border border-emerald-500/40 shadow-sm' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                <i class="fa-solid ${item.isUpcoming ? 'fa-flag-checkered text-emerald-400' : 'fa-rotate-left'}"></i>
                <span>${item.isUpcoming ? '完走（レポートへ）' : '計画中に戻す'}</span>
              </button>

              <a href="${item.link || '#'}" class="text-xs font-black text-slate-950 bg-amber-500 hover:bg-amber-400 px-4 py-2 rounded-xl shadow-md shadow-amber-500/20 transition inline-flex items-center gap-1.5">
                <span>詳細・しおりを見る</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </a>
            </div>
          </div>
        </div>
      `;
      return card;
    }

    // カード右上のメニュー開閉
    function toggleCardMenu(id) {
      // 他の開いているメニューをすべて閉じる
      document.querySelectorAll('[id^="card-menu-"]').forEach(el => {
        if (el.id !== `card-menu-${id}`) el.classList.add('hidden');
      });
      const menu = document.getElementById(`card-menu-${id}`);
      if (menu) menu.classList.toggle('hidden');
    }

    // 画面外クリックでメニューを閉じる
    document.addEventListener('click', () => {
      document.querySelectorAll('[id^="card-menu-"]').forEach(el => el.classList.add('hidden'));
    });

    // 削除確認モーダルの制御
    let targetDeleteId = null;

    function openDeleteModal(id, title) {
      targetDeleteId = id;
      document.getElementById('delete-target-title').textContent = `「${title}」`;
      document.getElementById('delete-confirm-modal').classList.remove('hidden');
      document.getElementById('delete-confirm-btn').onclick = executeDelete;
    }

    function closeDeleteModal() {
      document.getElementById('delete-confirm-modal').classList.add('hidden');
      targetDeleteId = null;
    }

    function executeDelete() {
      if (!targetDeleteId) return;
      const list = getTourings().filter(item => item.id !== targetDeleteId);
      saveTourings(list);
      closeDeleteModal();
    }

    function togglePlanStatus(id) {
      const list = getTourings();
      const plan = list.find(item => item.id === id);
      if (!plan) return;

      if (plan.isUpcoming) {
        if (confirm(`ツーリング「${plan.title}」を走行完了にし、過去のレポートへ移動しますか？`)) {
          plan.isUpcoming = false;
          plan.badge = '走行完了';
          saveTourings(list);
          switchTab('past');
        }
      } else {
        if (confirm(`ツーリング「${plan.title}」を「計画中」に戻しますか？`)) {
          plan.isUpcoming = true;
          plan.badge = '計画中';
          saveTourings(list);
          switchTab('upcoming');
        }
      }
    }

    function openNewPlanModal() {
      document.getElementById('new-plan-modal').classList.remove('hidden');
    }

    function closeNewPlanModal() {
      document.getElementById('new-plan-modal').classList.add('hidden');
    }

    function handleCreatePlan(e) {
      e.preventDefault();
      const statusValue = document.querySelector('input[name="form-status"]:checked').value;
      const isUpcoming = (statusValue === 'upcoming');

      const dateVal = document.getElementById('form-date').value.trim();

      const newPlan = {
        id: 'plan_' + Date.now(),
        isUpcoming: isUpcoming,
        title: document.getElementById('form-title').value.trim(),
        date: dateVal,
        isoDate: dateVal,
        area: document.getElementById('form-area').value.trim(),
        meeting: document.getElementById('form-meeting').value.trim() || '未定',
        distance: document.getElementById('form-distance').value.trim() || '未定',
        desc: document.getElementById('form-desc').value.trim() || '',
        badge: isUpcoming ? '計画中' : '走行完了',
        hotel: isUpcoming ? '日帰り/宿泊先' : '宿泊先',
        spot: document.getElementById('form-area').value.trim() || '目的地',
        link: 'touring-sample.html',
        members: []
      };

      const list = getTourings();
      list.unshift(newPlan);
      saveTourings(list);

      document.getElementById('new-plan-form').reset();
      closeNewPlanModal();
      switchTab(isUpcoming ? 'upcoming' : 'past');
    }

    function switchTab(tab) {
      const btnUpcoming = document.getElementById('tab-upcoming');
      const btnPast = document.getElementById('tab-past');
      const secUpcoming = document.getElementById('section-upcoming');
      const secPast = document.getElementById('section-past');

      if (tab === 'upcoming') {
        btnUpcoming.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition bg-amber-500 text-slate-950 shadow-md";
        btnPast.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-slate-200 hover:bg-slate-800";
        secUpcoming.classList.remove('hidden');
        secPast.classList.add('hidden');
      } else {
        btnPast.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition bg-amber-500 text-slate-950 shadow-md";
        btnUpcoming.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-slate-200 hover:bg-slate-800";
        secPast.classList.remove('hidden');
        secUpcoming.classList.add('hidden');
      }
    }

    // 初回レンダリング
    renderCards();
  </script>
</body>
</html>
